<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#1b1916">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kalkulator">
  <title>Kalkulator Kantor 1.1</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <button id="historyBtn" class="icon-btn" aria-label="Historia">HIST</button>
    <div class="topbar-spacer" aria-hidden="true"></div>
    <button id="settingsBtn" class="icon-btn" aria-label="Ustawienia">⚙</button>
  </header>

  <main class="calculator">
    <section class="display" aria-live="polite">
      <div class="display-glow" aria-hidden="true"></div>
      <div id="expression" class="expression" role="textbox" aria-label="Edytowane obliczenie" tabindex="0"></div>
      <div class="result-row"><div id="result" class="result">0</div></div>
    </section>

    <section class="recent" aria-label="Ostatnie obliczenia">
      <div class="recent-title"><span>Ostatnie</span><button id="openFullHistory" type="button">Pokaż historię</button></div>
      <div id="recentList" class="recent-list"></div>
    </section>

    <section id="keypad" class="keypad">
      <button class="danger utility" data-action="clear">C</button><button class="utility backspace-wide" data-action="backspace" aria-label="Usuń znak">⌫</button><button class="operator" data-token="÷">÷</button>
      <button data-token="7">7</button><button data-token="8">8</button><button data-token="9">9</button><button class="operator" data-token="×">×</button>
      <button data-token="4">4</button><button data-token="5">5</button><button data-token="6">6</button><button class="operator" data-token="−">−</button>
      <button data-token="1">1</button><button data-token="2">2</button><button data-token="3">3</button><button class="operator" data-token="+">+</button>
      <button class="zero" data-token="0">0</button><button data-token=",">,</button><button class="equals" data-action="equals">=</button>
    </section>
  </main>
</div>

<div id="drawerBackdrop" class="backdrop hidden"></div>
<aside id="historyDrawer" class="drawer" aria-hidden="true">
  <div class="drawer-head"><h2>Historia</h2><button id="closeHistory" class="close">×</button></div>
  <div id="historyList" class="history-list"></div>
  <div class="drawer-foot"><button id="clearHistory" class="secondary full">Wyczyść historię</button></div>
</aside>

<aside id="settingsDrawer" class="drawer right" aria-hidden="true">
  <div class="drawer-head"><h2>Ustawienia</h2><button id="closeSettings" class="close">×</button></div>
  <div class="settings">
    <label>Przechowuj historię
      <select id="retention"><option value="0" selected>Bez limitu</option><option value="14">14 dni</option><option value="30">30 dni</option><option value="90">90 dni</option></select>
    </label>
    <label>Liczba miejsc po przecinku
      <select id="precision"><option>2</option><option>4</option><option selected>8</option><option>12</option></select>
    </label>
    <label>Wygląd
      <select id="appearance"><option value="system">Systemowy</option><option value="graphite">Grafitowy</option><option value="warm" selected>Ciepły szary</option><option value="light">Jasny</option></select>
    </label>
    <label class="switch"><span>Wynik na żywo</span><input id="liveResult" type="checkbox" checked></label>
    <label class="switch"><span>Separator tysięcy</span><input id="thousandsSeparator" type="checkbox" checked></label>
    <label class="switch"><span>Animacje</span><input id="animations" type="checkbox" checked></label>
    <section class="settings-section backup-section">
      <h3>Kopie zapasowe</h3>
      <label class="switch"><span>Przypominaj o kopii</span><input id="backupReminder" type="checkbox"></label>
      <label id="backupIntervalRow">Przypominaj
        <select id="backupInterval"><option value="1">Codziennie</option><option value="3">Co 3 dni</option><option value="7" selected>Co 7 dni</option><option value="14">Co 14 dni</option><option value="30">Co 30 dni</option></select>
      </label>
      <div class="backup-status"><span>Ostatnia kopia</span><strong id="lastBackup">Nigdy</strong></div>
      <button id="backupNowBtn" class="secondary full">Utwórz kopię (.kcalc)</button>
      <button id="csvBtn" class="secondary full">Eksportuj CSV</button>
      <button id="importBtn" class="secondary full">Importuj kopię (.kcalc)</button>
      <input id="importFile" type="file" accept=".kcalc,application/json,application/octet-stream" hidden>
    </section>
  </div>
</aside>

<div id="displayMenu" class="context-menu hidden" role="menu">
  <button data-display-menu="paste">Wklej ze schowka</button>
</div>

<div id="contextMenu" class="context-menu hidden" role="menu">
  <button data-menu="use">Użyj ponownie</button>
  <button data-menu="copy">Kopiuj całe obliczenie</button>
  <button data-menu="send">Wyślij</button>
  <button data-menu="note">Dodaj / edytuj notatkę</button>
  <button data-menu="edit">Edytuj zapisane obliczenie</button>
  <button data-menu="delete" class="danger-text">Usuń</button>
</div>

<div id="sendMenu" class="context-menu hidden" role="menu" aria-label="Wybierz sposób wysłania">
  <button data-send="sms"><strong>SMS</strong><span class="menu-subtitle">Treść wiadomości</span></button>
  <button data-send="mms"><strong>MMS</strong><span class="menu-subtitle">Obraz z obliczeniem i datą</span></button>
  <button data-send="cancel" class="muted-action">Anuluj</button>
</div>

<dialog id="textDialog">
  <form method="dialog">
    <h3 id="dialogTitle">Notatka</h3>
    <textarea id="dialogText" rows="5"></textarea>
    <div class="dialog-actions"><button value="cancel" class="secondary">Anuluj</button><button id="dialogSave" value="default">Zapisz</button></div>
  </form>
</dialog>
<div id="backupPrompt" class="backup-prompt hidden" role="dialog" aria-label="Przypomnienie o kopii zapasowej">
  <div><strong>Czas utworzyć kopię zapasową</strong><span id="backupPromptText"></span></div>
  <div class="backup-prompt-actions"><button id="backupLater" class="secondary">Później</button><button id="backupPromptNow">Utwórz kopię</button></div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
